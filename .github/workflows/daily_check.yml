name: Daily Freebies Check

on:
  schedule:
    # Запуск каждый день в 20:00 UTC (23:00 по МСК)
    - cron: '0 20 * * *'
  # Возможность запустить вручную из вкладки Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Freebies Checker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: |
          python run_action.py

      - name: Commit and push updated giveaways state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add giveaways.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update giveaways database [skip ci]" && git push)
